releaseNotes: "Play stays inside the main StreamerX window, with Back, fullscreen and automatic resume.\nAnime is now a Search filter, and All searches include anime results.\nFavourites are separate from My List and sync with your OpenBackend account.\nDownload movies and episodes in the Windows and Android apps, with progress, pause, retry, removal and offline playback.\nDub preference carries between episodes, falls back to sub when dub is unavailable, and is retained for later episodes.\nAutomatic data saving prefers lower quality away from Wi-Fi. Choose a quality to override it; available resolutions depend on the source.\nExisting account sessions, saved titles and viewing progress are preserved."
